name: Import and qualify source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: noflyers-source-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct and validate source
        shell: bash
        run: |
          cat source-import.parts/source.part.* | base64 --decode > "$RUNNER_TEMP/source.tar.gz"
          actual=$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          [[ $actual == 1e6fe4910af079f33d1bf6c05541ed53fbc8c8c704e0f276acbd97e4bcf76b4b ]] || {
            printf 'ERROR: source bundle hash mismatch: %s\n' "$actual" >&2
            exit 1
          }
          SOURCE_ARCHIVE="$RUNNER_TEMP/source.tar.gz" python3 - <<'PY'
          import os, pathlib, tarfile
          with tarfile.open(os.environ['SOURCE_ARCHIVE'], 'r:gz') as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C .
          rm -rf source-import.parts .github/workflows/import-source.yml source-import.trigger

      - name: Generate wrapper, test, lint and build
        shell: bash
        run: |
          gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Validate and package evidence
        shell: bash
        run: |
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          tools=$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)
          [[ -n $tools ]] || { printf 'ERROR: Android build-tools unavailable.\n' >&2; exit 1; }
          debug=app/build/outputs/apk/debug/app-debug.apk
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          [[ -s $debug && -s $unsigned ]] || { printf 'ERROR: APK output missing.\n' >&2; exit 1; }
          "$tools/apksigner" verify --verbose --print-certs "$debug"
          "$tools/zipalign" -c -P 16 4 "$debug"
          "$tools/zipalign" -c -P 16 4 "$unsigned"
          "$tools/aapt" dump badging "$debug" | grep -Fq "package: name='io.github.cbkii.noflyers' versionCode='15' versionName='0.1.5'"
          mkdir -p qualification/apksigner/lib qualification/gradle-wrapper
          cp "$tools/apksigner" "$tools/zipalign" "$tools/aapt" qualification/apksigner/
          cp "$tools/lib/apksigner.jar" qualification/apksigner/lib/
          cp -a gradle/wrapper qualification/gradle-wrapper/
          cp gradlew gradlew.bat qualification/gradle-wrapper/
          find app/build/outputs/apk -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > qualification/SHA256SUMS-build
          cat qualification/SHA256SUMS-build

      - uses: actions/upload-artifact@v4
        with:
          name: noflyers-import-qualification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/mapping/release/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            qualification/

      - name: Commit qualified source
        shell: bash
        run: |
          rm -rf qualification
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare NoFlyers v0.1.5'
          git push origin HEAD:"${GITHUB_HEAD_REF:-main}"
