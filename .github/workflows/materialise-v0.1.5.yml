name: Materialise NoFlyers v0.1.5 asset

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: noflyers-materialise-v0.1.5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialise:
    if: github.event.pull_request.head.ref == 'agent/import-noflyers-v0.1.5'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build exact unsigned APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          printf '%s  %s\n' \
            e4794f609e6b015b0f54328fe11db62df1d56941b5423119c3360a72830e3b9d \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            | sha256sum -c -

      - name: Reconstruct and verify signed APK
        shell: bash
        run: |
          payload=release-assets/v0.1.5/.payload/NoFlyers-v0.1.5.patch.gz.b64
          tr -d '[:space:]' < "$payload" | base64 --decode > "$RUNNER_TEMP/noflyers.patch.gz"
          printf '%s  %s\n' \
            336a17ec465b0b4cf7713403799bc4ef34c43267220e4cb30e2de0478928ec78 \
            "$RUNNER_TEMP/noflyers.patch.gz" \
            | sha256sum -c -

          UNSIGNED_APK=app/build/outputs/apk/release/app-release-unsigned.apk \
          PATCH_GZ="$RUNNER_TEMP/noflyers.patch.gz" \
          SIGNED_APK=release-assets/v0.1.5/NoFlyers-v0.1.5.apk \
          python3 - <<'PY'
          import gzip
          import hashlib
          import os
          import pathlib
          import struct

          unsigned = pathlib.Path(os.environ['UNSIGNED_APK']).read_bytes()
          patch = gzip.decompress(pathlib.Path(os.environ['PATCH_GZ']).read_bytes())
          if patch[:4] != b'NFP1':
              raise SystemExit('invalid NoFlyers patch header')

          output = bytearray()
          offset = 4
          while True:
              opcode = patch[offset:offset + 1]
              offset += 1
              if opcode == b'E':
                  break
              if opcode == b'A':
                  length = struct.unpack('>I', patch[offset:offset + 4])[0]
                  offset += 4
                  output += patch[offset:offset + length]
                  offset += length
                  continue
              if opcode == b'C':
                  start, length = struct.unpack('>II', patch[offset:offset + 8])
                  offset += 8
                  output += unsigned[start:start + length]
                  continue
              raise SystemExit(f'unknown NoFlyers patch opcode: {opcode!r}')

          digest = hashlib.sha256(output).hexdigest()
          expected = 'f5f6d919e1c734c7c521cabf43d29e0363d8398ac86ee028915c299968a07862'
          if digest != expected:
              raise SystemExit(f'signed APK hash mismatch: {digest}')

          destination = pathlib.Path(os.environ['SIGNED_APK'])
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(output)
          PY

          (cd release-assets/v0.1.5 && sha256sum -c SHA256SUMS)
          unzip -tq release-assets/v0.1.5/NoFlyers-v0.1.5.apk
          rm -rf release-assets/v0.1.5/.payload

      - name: Commit exact signed APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-assets/v0.1.5
          git commit -m 'Add signed NoFlyers v0.1.5 APK'
          git push origin HEAD:"$GITHUB_HEAD_REF"
