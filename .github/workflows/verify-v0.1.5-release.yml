name: Verify published NoFlyers v0.1.5

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: noflyers-verify-published-v0.1.5
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/verify-noflyers-v0.1.5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: bb2fb458ebc8d17edb24182ba68be92f255f954a
      RELEASE_TAG: v0.1.5
      APK_SHA256: f5f6d919e1c734c7c521cabf43d29e0363d8398ac86ee028915c299968a07862

    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: bb2fb458ebc8d17edb24182ba68be92f255f954a

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify tag and release metadata
        shell: bash
        run: |
          repo=$GITHUB_REPOSITORY
          metadata=$(gh release view "$RELEASE_TAG" --repo "$repo" \
            --json tagName,name,isDraft,isPrerelease,url,assets)
          jq -e --arg tag "$RELEASE_TAG" \
            '.tagName == $tag and .name == ("NoFlyers " + $tag) and (.isDraft | not) and (.isPrerelease | not)' \
            <<<"$metadata" >/dev/null
          jq -e '
            ([.assets[].name] | sort) ==
            (["CERTIFICATE-SHA256.txt", "NoFlyers-v0.1.5.apk", "SHA256SUMS"] | sort)
          ' <<<"$metadata" >/dev/null
          jq -r '.url' <<<"$metadata"

          ref_json=$(gh api "/repos/$repo/git/ref/tags/$RELEASE_TAG")
          object_type=$(jq -r '.object.type' <<<"$ref_json")
          object_sha=$(jq -r '.object.sha' <<<"$ref_json")
          if [[ $object_type == tag ]]; then
            tagged_sha=$(gh api "/repos/$repo/git/tags/$object_sha" --jq '.object.sha')
          else
            tagged_sha=$object_sha
          fi
          if [[ $tagged_sha != "$SOURCE_SHA" ]]; then
            printf 'ERROR: Tag resolves to %s, expected %s.\n' "$tagged_sha" "$SOURCE_SHA" >&2
            exit 1
          fi

      - name: Download and verify published assets
        shell: bash
        run: |
          remote="$RUNNER_TEMP/published"
          validation="$RUNNER_TEMP/validation"
          mkdir -p "$remote" "$validation/release-assets/v0.1.5"

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote"
          printf '%s  %s\n' "$APK_SHA256" "$remote/NoFlyers-v0.1.5.apk" | sha256sum -c -
          cmp --silent \
            release-assets/v0.1.5/NoFlyers-v0.1.5.apk \
            "$remote/NoFlyers-v0.1.5.apk"
          cmp --silent release-assets/v0.1.5/SHA256SUMS "$remote/SHA256SUMS"
          cmp --silent release-assets/v0.1.5/CERTIFICATE-SHA256.txt "$remote/CERTIFICATE-SHA256.txt"

          cp -a app scripts release-notes "$validation/"
          cp "$remote"/* "$validation/release-assets/v0.1.5/"
          (cd "$validation" && bash scripts/verify-release.sh "$RELEASE_TAG")

      - name: Verify GitHub provenance attestation
        shell: bash
        run: >-
          gh attestation verify
          "$RUNNER_TEMP/published/NoFlyers-v0.1.5.apk"
          --repo "$GITHUB_REPOSITORY"
